name: KersSecure service checks
on:
  push:
    branches: [main]
    paths: ['services/**', 'engine-csharp/**', '.github/workflows/services.yml']
  pull_request:
    branches: [main]
    paths: ['services/**', 'engine-csharp/**', '.github/workflows/services.yml']
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/obfuscator/requirements.txt -r services/api/requirements.txt -r services/discord-bot/requirements.txt
      - run: python -m compileall -q services
      - run: cd services/obfuscator && pytest -q
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build engine-csharp/KersSecure.Engine/KersSecure.Engine.csproj --configuration Release
