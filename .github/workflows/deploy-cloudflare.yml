name: Deploy KersSecure to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/kerssecure
          SESSION_SECRET: ci-build-only-session-secret-000000000000000000000000
          LICENSE_HASH_SECRET: ci-build-only-license-secret-000000000000000000000000
          APP_URL: https://kerssecure.itskers0ne.workers.dev
          DISCORD_REDIRECT_URI: https://kerssecure.itskers0ne.workers.dev/api/auth/discord/callback
