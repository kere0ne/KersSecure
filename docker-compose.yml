services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kerssecure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
      POSTGRES_DB: kerssecure
    volumes: [kerssecure_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerssecure"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./services/api
    env_file: ./services/api/.env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
  obfuscator:
    build: ./services/obfuscator
    ports: ["8100:8100"]
  discord-bot:
    build: ./services/discord-bot
    env_file: ./services/discord-bot/.env
    depends_on: [api]
volumes:
  kerssecure_pg:
